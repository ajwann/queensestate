[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "queensestate"
dynamic = ["version"]
description = "MCP server for the City of Charlotte Open Data Portal (data.charlottenc.gov)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.2,<3",
    "pydantic>=2.13,<3",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
queensestate = "queensestate.server:main"

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "respx>=0.23",
    "ruff>=0.16",
]

[tool.hatch.version]
path = "src/queensestate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/queensestate"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
